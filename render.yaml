services:
  # The whole product is one service: the four HTTP tools AssemblyAI calls,
  # the call page itself, and the owner's board. The starter's separate
  # browser server is not used here; backend/static/index.html replaces it.
  #
  # After the first deploy, put this service's public URL in .env as
  # BACKEND_URL and run `AGENT=bakery python publish.py` so the agent's tool
  # URLs point here rather than at a dev tunnel.
  #
  # Two things the free plan will do to a demo:
  #   - it spins down after 15 minutes idle and cold-starts in ~50s, so a tool
  #     call into a sleeping service times out while the caller waits;
  #   - its filesystem is ephemeral, so every redeploy wipes bakery.db.
  # Before any judged demo, move to a paid instance and attach a disk.
  - type: web
    name: bakery-platform
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Sent by the agent as X-Tool-Key on every tool call. Render invents one;
      # copy it into .env as TOOL_API_KEY before publishing the agent, or the
      # tools answer 401 mid-conversation.
      - key: TOOL_API_KEY
        generateValue: true
      # Mints the page's 60-second session tokens and reads call history.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # The published agent this service serves. Copy AGENT_ID_BAKERY from .env.
      - key: AGENT_ID
        sync: false
      - key: SHOP_NAME
        value: Rosewood Bakery
      # Point at a mounted disk once you add one, e.g. /var/data/bakery.db
      - key: DB_PATH
        value: ''
